[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brainmaze-utils"
version = "3.0.0"
description = "BrainMaze: Brain Electrophysiology, Behavior and Dynamics Analysis Toolbox"
authors = [
    {name = "Filip Mivalt", email = "mivalt.filip@mayo.edu"},
]
readme = "README.rst"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
classifiers = [
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: BSD License",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "python-dateutil",
    "tqdm",
]

[project.optional-dependencies]
test = [
    "pytest",
    "sphinx",
    "sphinx_book_theme",
]

[project.urls]
Homepage = "https://github.com/bnelair/brainmaze-utils"

[tool.setuptools.packages.find]
where = ["."]
# Ship only the package itself (never tests/, docs_src/, img/).
include = ["brainmaze_utils", "brainmaze_utils.*"]
exclude = ["brainmaze_utils.tests", "brainmaze_utils.tests.*"]

[tool.setuptools]
# No package data: brainmaze_utils needs no non-Python files at runtime. The sdist is
# trimmed the same way by MANIFEST.in.
include-package-data = false
