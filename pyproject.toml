[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brainmaze-utils"
version = "3.0.0"
description = "BrainMaze: Brain Electrophysiology, Behavior and Dynamics Analysis Toolbox"
authors = [
    {name = "Filip Mivalt", email = "mivalt.filip@mayo.edu"},
]
readme = "README.rst"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    # python-dateutil <3: dateutil 3.0.0 (2026-10-21) rewrote tz.tzfile, and pandas (<= 3.1.0)
    # detects dateutil zones through private attributes that 3.0 removed (pandas GH#71459).
    # dateutil.tz.gettz() zones WITH DST/transitions (e.g. 'America/Chicago') then break inside
    # pandas: on pandas 3.x they raise AttributeError ('NoneType' object has no attribute
    # 'total_seconds'); on pandas 2.x a scalar Timestamp.tz_convert silently returns a
    # tz-naive UTC wall time (Series/DataFrame paths raise). Fixed-offset gettz zones,
    # tzutc() and tzlocal() are unaffected. dateutil 3 also changes the UTC offset of
    # nonexistent (DST-gap) local times. The pandas fix (pandas#71495) is expected in
    # pandas 3.1.1, with no 2.x/3.0.x backport, and pip cannot express "dateutil 3 only with
    # a fixed pandas". So lift `<3` only TOGETHER WITH raising the floor pandas>=2.0 to the
    # first fixed pandas release (a support-range change, not a patch release), and only
    # once the suite passes on dateutil 3.
    # >=2.8.2: the floor of every supported pandas (pandas 2.0-2.2 require >=2.8.2) and the
    # version the family Compatibility "lowest" job resolves and tests.
    "python-dateutil>=2.8.2,<3",
    "tqdm",
]

[project.optional-dependencies]
test = [
    "pytest",
    "sphinx",
    "sphinx_book_theme",
]

[project.urls]
Homepage = "https://github.com/bnelair/brainmaze-utils"

[tool.setuptools.packages.find]
where = ["."]
# Ship only the package itself (never tests/, docs_src/, img/). The tests live in the
# top-level tests/ directory, which `include` already leaves out.
include = ["brainmaze_utils", "brainmaze_utils.*"]

[tool.setuptools]
# No package data: brainmaze_utils needs no non-Python files at runtime (the shared artifact
# check allows only .py/.pyi/py.typed inside the package). If a runtime data file is ever
# added, list it under [tool.setuptools.package-data] AND in `required-assets` in
# .github/workflows/ci.yml + release.yml; otherwise it silently drops out of the wheel
# while the tests (which import from the source tree) still pass.
include-package-data = false
